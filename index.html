            {

            • <span class="issue-link" onclick="showIssue('email')">Handling Outlook and email configuration issues</span>.<br>

• <span class="issue-link" onclick="showIssue('l2desktop')">Handling escalated desktop, application, and system-related issues</span>.<br>

• <span class="issue-link" onclick="showIssue('l2vpn')">Performing advanced troubleshooting for VPN, network, and connectivity issues</span>.<br>

• <span class="issue-link" onclick="showIssue('mailbox')">Resolving Outlook synchronization, mailbox, and email flow issues</span>.<br>

• <span class="issue-link" onclick="showIssue('software')">Troubleshooting software installation and application performance issues</span>.<br>

• <span class="issue-link" onclick="showIssue('access')">Handling user access management and permission-related issues</span>.<br>

• <span class="issue-link" onclick="showIssue('windows')">Supporting Windows OS-related troubleshooting and configuration issues</span>.<br>

• <span class="issue-link" onclick="showIssue('majorincident')">Coordinating with infrastructure and backend teams for major incidents</span>.<br><br>

In Concentrix, I worked on CRM platforms, ticketing tools, remote desktop applications, Active Directory, Office 365, and internal support systems.<br><br>

Through these experiences, I developed strong technical troubleshooting, incident management, communication, escalation handling, analytical thinking, and problem-solving skills.




        `
            },
            {
                question: "2. What is the difference between Windows 10 and Windows 11?",
                answer: `
            Think of Windows 10 as a reliable classic car and Windows 11 as the modern electric version. While they do the same job, the internal architecture has evolved.<br><br>
            <b>Key Differences:</b><br>
            • <b>Interface:</b> Windows 11 moves the Start menu to the center and uses "Mica" design (translucent windows).<br>
            • <b>Snap Layouts:</b> Built-in multitasking grids to organize windows instantly.<br>
            • <b>Security:</b> Windows 11 requires <b>TPM 2.0</b>, making it more secure against hackers.<br>
            • <b>Performance:</b> Windows 11 handles memory better, waking up from sleep faster.<br><br>
            My Take: Windows 11 isn't just a "skin"; it’s a more secure and performance-optimized version of Windows 10.
        `
            },
            {
                question: "3. How do you troubleshoot a slow computer?",
                answer: `
            When a computer is slow, I follow a "Resource-First" approach to find the bottleneck.<br><br>
            <b>Step 1: Check Task Manager</b><br>
            I press <b>Ctrl + Shift + Esc</b> and check the CPU and Memory. If an app is using 90%+, I click <b>End Task</b>.<br><br>
            <b>Step 2: Manage Startup Apps</b><br>
            In Task Manager, I go to the <b>Startup</b> tab and <b>Disable</b> non-essential apps.<br><br>
            <b>Step 3: System Cleanup</b><br>
            I clear the "trash" using these commands in the Run box (Win + R):<br>
            • <code>temp</code><br>
            • <code>%temp%</code><br>
            • <code>prefetch</code><br>
            I also run <b>Disk Cleanup</b> to remove system-level junk files.
        `
            },
            {
                question: "4. What will you do if a PC is not booting?",
                answer: `
            If a PC won't start, I follow a "Logical Isolation" process.<br><br>
            <b>Step 1: Power & Hardware Check</b><br>
            I check cables and listen for <b>Beep Codes</b>. If there are no lights, it’s likely a Power Supply (PSU) issue.<br><br>
            <b>Step 2: Hard Reset</b><br>
            I unplug the power and hold the power button for 30 seconds to drain static electricity.<br><br>
            <b>Step 3: Windows Recovery (WinRE)</b><br>
            I restart the PC 3 times to trigger the <b>Automatic Repair</b> screen. From there, I can try a System Restore or boot into Safe Mode.
        `
            },
            {
                question: "5. What is Safe Mode?",
                answer: `
            Safe Mode is a "Diagnostic State" where Windows starts with only the bare minimum drivers.<br><br>
            <b>How it works:</b><br>
            It doesn't load third-party apps or non-essential drivers. If the computer works fine in Safe Mode, it proves that the hardware is healthy and the problem is software-related.<br><br>
            <b>How to enter:</b><br>
            Hold <b>Shift</b> while clicking <b>Restart</b> > Troubleshoot > Advanced options > Startup Settings > Restart > Press 4.
        `
            },
            {
                question: "6. How do you check system configuration?",
                answer: `
            I use different tools depending on the detail needed:<br><br>
            • <b>The Fast Way:</b> Go to Settings > System > About.<br>
            • <b>The Professional Way:</b> Press Win + R, type <code>msinfo32</code>. This shows BIOS version and Motherboard details.<br>
            • <b>Graphics Check:</b> Press Win + R, type <code>dxdiag</code> to check GPU and VRAM.
        `
            },
            {
                question: "7. Difference between Restart and Shutdown?",
                answer: `
            In modern Windows, they are different due to <b>Fast Startup</b>.<br><br>
            • <b>Shutdown:</b> Saves the OS kernel state to disk to boot faster next time. It does <b>not</b> clear out all system errors.<br>
            • <b>Restart:</b> This is a "Cold Boot." It kills all processes, clears the RAM completely, and starts fresh.<br><br>
            <b>Tip:</b> If a computer is glitchy, a <b>Restart</b> is better than a Shutdown.
        `
            },
            {
                question: "8. What is Task Manager used for?",
                answer: `
            Task Manager is the "Command Center" for system health.<br><br>
            <b>Primary Uses:</b><br>
            1. <b>Process Management:</b> Closing "Not Responding" apps.<br>
            2. <b>Performance Monitoring:</b> Real-time graphs of CPU, RAM, and Disk usage.<br>
            3. <b>Startup Control:</b> Speeding up boot time by disabling apps.<br><br>
            <b>Access:</b> Press <b>Ctrl + Shift + Esc</b>.
        `
            },
            {
                question: "9. How do you uninstall software?",
                answer: `
            1. Open <b>Control Panel</b> > Programs > Programs and Features.<br>
            2. Right-click the software and select <b>Uninstall</b>.<br>
            3. <b>Pro Tip:</b> I also check <code>C:\\Program Files</code> and <code>AppData</code> to delete leftover folders to keep the drive clean.
        `
            },
            {
                question: "10. What is BIOS?",
                answer: `
            BIOS stands for <b>Basic Input/Output System</b>. It is a chip on the motherboard.<br><br>
            <b>Its Job:</b><br>
            It is the first thing that wakes up when you press power. It performs a <b>POST (Power-On Self-Test)</b> to check if the RAM, CPU, and Drive are working. If okay, it starts Windows.
        `
            },
            {
                question: "11. What is Device Manager?",
                answer: `
            Device Manager is a library of all hardware connected to the PC.<br><br>
            <b>Key Functions:</b><br>
            • <b>Driver Management:</b> Updating or rolling back hardware software.<br>
            • <b>Troubleshooting:</b> A <b>Yellow Triangle</b> indicates a driver error.<br>
            • <b>Access:</b> Press Win + R and type <code>devmgmt.msc</code>.
        `
            },

            {
                question: "12. What is Networking?",
                answer: `
            Networking is the practice of connecting computers and devices together to share resources, like files, internet connection, and printers.<br><br>
            Think of it like a <b>social network for machines</b>. Instead of people sharing photos, computers share data packets so they can "talk" to each other over a cable or Wi-Fi.
        `
            },
            {
                question: "13. What is an IP address?",
                answer: `
            An IP (Internet Protocol) address is a unique string of numbers assigned to every device on a network.<br><br>
            It works exactly like a <b>Home Address</b>. If you want to receive a letter, the postman needs your address. Similarly, if a computer wants to receive a website, the internet needs its IP address to know where to send the data.
        `
            },
            {
                question: "14. Difference between Public and Private IP?",
                answer: `
            • <b>Public IP:</b> This is your "Global Address." It is provided by your ISP (Internet Service Provider) and identifies your entire home or office to the whole world.<br>
            • <b>Private IP:</b> This is your "Internal Address." It is used only inside your local network (like your house) to tell your laptop apart from your phone or printer.<br><br>
            <b>Analogy:</b> A Public IP is like the <b>Building Number</b> of an apartment, and a Private IP is like the <b>Flat Number</b> inside that building.
        `
            },
            {
                question: "15. What is DNS?",
                answer: `
            DNS stands for <b>Domain Name System</b>. It is often called the "Phonebook of the Internet."<br><br>
            Computers only understand numbers (IP addresses), but humans prefer names like <code>google.com</code>. When you type a website name, DNS translates that name into the correct IP address so your browser can find the server.
        `
            },
            {
                question: "16. What is DHCP?",
                answer: `
            DHCP stands for <b>Dynamic Host Configuration Protocol</b>. It is a service that automatically gives an IP address to every device that connects to a network.<br><br>
            Imagine a <b>Manager at a Hotel</b> who gives a room key to every guest as they arrive. Without DHCP, you would have to manually type in a unique IP address for every device, which would be very difficult in large offices.
        `
            },
            {
                question: "17. What is a VPN?",
                answer: `
            A VPN (Virtual Private Network) creates a <b>secure, encrypted "tunnel"</b> between your device and the internet.<br><br>
            It hides your real IP address and encrypts your data. I use it to allow remote employees to securely access company files as if they were sitting in the office, even if they are using a public Wi-Fi at a cafe.
        `
            },
            {
                question: "18. What will you do if internet is not working?",
                answer: `
            I follow a "Bottom-Up" troubleshooting approach:<br><br>
            1. <b>Physical Check:</b> Ensure the LAN cable is plugged in or Wi-Fi is toggled ON.<br>
            2. <b>The 30-Second Rule:</b> Restart the Router and the PC to clear temporary glitches.<br>
            3. <b>Check IP:</b> Run <code>ipconfig</code> to see if the PC has a valid IP or a "169.x.x.x" address (which means a DHCP failure).<br>
            4. <b>DNS Flush:</b> Run <code>ipconfig /flushdns</code> to clear corrupted website records.<br>
            5. <b>Ping Test:</b> Ping a public site like <code>ping 8.8.8.8</code>. If it replies, the issue is DNS; if not, the issue is the ISP or hardware.
        `
            },
            {
                question: "19. What is the difference between LAN and WAN?",
                answer: `
            • <b>LAN (Local Area Network):</b> Covers a small area like a single home, office, or building. It is very fast and private.<br>
            • <b>WAN (Wide Area Network):</b> Covers a large area like a city, country, or even the whole world. The **Internet** is the largest WAN in existence.<br><br>
            <b>Analogy:</b> LAN is like talking to someone in your <b>living room</b>; WAN is like making a <b>long-distance phone call</b>.
        `
            },
            {
                question: "20. What is ping command?",
                answer: `
            The <code>ping</code> command is a tool used to test if a device is "alive" and reachable on a network.<br><br>
            <b>How to use:</b> Open CMD and type <code>ping google.com</code>.<br>
            It sends a small "packet" of data and waits for a reply. If you get a "Reply," the connection is working. If you see "Request Timed Out," there is a break in the connection.
        `
            },
            {
                question: "21. What is ipconfig?",
                answer: `
            <code>ipconfig</code> (IP Configuration) is a command-line tool that shows all your current network settings.<br><br>
            <b>Key uses:</b><br>
            • <b>ipconfig:</b> Shows your IP Address and Default Gateway.<br>
            • <b>ipconfig /release & /renew:</b> Forces the PC to get a brand-new IP from the router.<br>
            • <b>ipconfig /all:</b> Shows extra details like your physical MAC address and DNS servers.
        `
            },
            {
                question: "22. What is Default Gateway?",
                answer: `
            The Default Gateway is the <b>"Exit Door"</b> for your network.<br><br>
            Whenever your computer wants to send data outside your house (like to a website), it sends it to the Default Gateway (usually your Router's IP address). The router then forwards that data to the wider internet.
        `
            },

            {
                question: "23. What is Active Directory (AD)?",
                answer: `
            Active Directory is a <b>Centralized Database</b> managed by Microsoft that stores information about all users, computers, and printers in a company network.<br><br>

        `
            },
            {
                question: "24. How do you reset a password in AD?",
                answer: `
            I use a tool called <b>ADUC (Active Directory Users and Computers)</b> to handle this common request:<br><br>
            1. Open ADUC and search for the user's name.<br>
            2. Right-click the user account and select <b>Reset Password</b>.<br>
            3. Type the new temporary password.<br>
            4. <b>Important:</b> I always check the box <b>"User must change password at next logon"</b> so the user can set their own private password immediately.
        `
            },
            {
                question: "25. What is a user account lockout?",
                answer: `
            An account lockout is a security feature that stops someone from trying to "guess" a password by typing it incorrectly many times.<br><br>
            <b>How it works:</b> Most companies set a policy (e.g., after 3 or 5 failed attempts). Once triggered, the account is locked. To fix it, I find the user in AD, go to <b>Properties > Account</b>, and check the box <b>"Unlock account"</b> to give the user access again.
        `
            },
            {
                question: "26. Difference between Authentication and Authorization?",
                answer: `
            These sound similar but do very different jobs:<br><br>
            • <b>Authentication:</b> Is about <b>Identity</b>. (e.g., "Are you really Sarfraz?" — Verified by your password or fingerprint).<br>
            • <b>Authorization:</b> Is about <b>Permission</b>. (e.g., "Now that I know you are Sarfraz, are you allowed to see the 'Salary' folder?" — Verified by your group permissions).<br><br>
            <b>Analogy:</b> Authentication is the <b>ID card</b> that lets you into the building; Authorization is the <b>Key</b> that lets you into a specific room.
        `
            },
            {
                question: "27. How do you give folder access to a user?",
                answer: `
            To give access properly, I follow the <b>Principle of Least Privilege</b>:<br><br>
            1. Right-click the folder and go to <b>Properties > Security</b>.<br>
            2. Click <b>Edit</b> and then <b>Add</b>.<br>
            3. Type the user's name and click "Check Names" to find them in AD.<br>
            4. Select the permissions (Read, Write, or Modify).<br><br>
            <b>Pro Tip:</b> For a big company, I don't add users one by one. I add them to a <b>Security Group</b> in AD and give that group access to the folder.
        `
            },
            {
                question: "28. What is Group Policy?",
                answer: `
            Group Policy (GPO) is a set of <b>Rules and Restrictions</b> created by the IT Administrator that applies to everyone in the company.<br><br>

            • Set a company wallpaper for everyone.<br>
            • Block the use of USB drives for security.<br>
            • Automatically install a specific software on all laptops.<br><br>
            It is a powerful tool to ensure every computer follows company standards without visiting every desk.
        `
            },

        `

            {

            2. <b>Task Manager:</b> Kill any "hanging" Outlook processes and try again.<br>
            3. <b>Repair Office:</b> Go to Control Panel > Programs > Change > <b>Quick Repair</b>.<br>
            4. <b>New Profile:</b> If the settings are corrupted, I create a fresh profile from the <b>Mail</b> icon in the Control Panel.
        `
            },
            {
                question: "31. User is not receiving emails — what will you check?",
                answer: `
            I investigate from the outside in:<br><br>
            1. <b>Internet & Status:</b> Is the user's internet working? Is Outlook showing "Connected to Microsoft Exchange" at the bottom?<br>
            2. <b>Webmail (OWA):</b> Ask the user to check <b>Outlook Web App</b>. If emails are there, the problem is their local Outlook app; if not, the problem is the server.<br>
            3. <b>Storage:</b> Is the mailbox full? A 100% full mailbox stops all incoming mail.<br>
            4. <b>Junk/Filters:</b> Check the Junk folder and any "Rules" that might be moving mail automatically.
        `
            },
            {
                question: "32. What is OST and PST file?",
                answer: `
            These are the "Suitcases" where Outlook keeps your data:<br><br>
            • <b>OST (Offline Storage Table):</b> A <b>Mirror Image</b> of your mailbox. It saves a copy of your emails on your PC so you can see them even when you aren't connected to the internet.<br>
            • <b>PST (Personal Storage Table):</b> An <b>Archive</b> file. It is used to move old emails off the server and store them locally to save space.<br><br>
            <b>Technician Tip:</b> If an OST file gets corrupted, I simply delete it, and Outlook will rebuild a fresh one from the server.
        `
            },
            {
                question: "33. How do you configure Outlook?",

            2. Enter the **Password** when the pop-up appears.<br>
            3. <b>Autodiscover:</b> Windows will automatically find the server settings and sync everything.<br><br>

        `
            },
            {

        `
            },

            },
            {

            },

                question: "37. What is SLA?",

            • **Example:** A "P1" (Highest priority) ticket might have a 1-hour SLA, while a "P4" (Low priority) might have a 3-day SLA. If we take too long, we "Breach" the SLA, which is bad for business.
        `
            },
            {
                question: "38. Difference between Incident and Service Request?",
                answer: `
            • <b>Incident:</b> Something is **Broken**. (e.g., "My Outlook is crashing," or "The printer is on fire.") The goal is to fix it.<br>
            • <b>Service Request:</b> You need **Something New**. (e.g., "I need a new mouse," or "I need access to the HR folder.") Nothing is broken; the user just needs a new resource.
        `
            },
            {
                question: "39. How do you prioritize tickets?",
                answer: `
            I prioritize based on **Impact** and **Urgency**:<br><br>
            1. <b>Critical (P1):</b> A server is down, and 100 people cannot work. (Handle Immediately).<br>
            2. <b>High (P2):</b> A manager cannot access their email. (Handle ASAP).<br>
            3. <b>Medium (P3):</b> One user's printer is jammed, but they can use the one down the hall.<br>
            4. <b>Low (P4):</b> A user wants to change their profile picture.
        `
            },
            {
                question: "40. What is escalation?",
                answer: `
            Escalation means moving a ticket to a **Higher Level Team** when the issue is too complex for the current level.<br><br>
            • <b>Functional Escalation:</b> Moving a ticket from L1 to L2 or L3 because it requires deeper technical access.<br>
            • <b>Hierarchical Escalation:</b> Informing a Manager about a major issue or a very angry user to get extra support.
        `
            },
            {
                question: "41. What will you do if the issue is not resolved?",

                <br><br>

            <span class="how-where d-block mt-1">

                <br>
                <b>ipconfig /all</b>

                <br><br>

                Verified whether system received valid IP address, subnet mask, default gateway, and DNS server from network.

                <br><br>

            </span>

            <span class="how-where d-block mt-1">

            windows: {

        <div class="mb-3">

            • Automatic Restart Loop<br>
            • Windows Freezing<br>
            • Black Screen After Login<br>
            • Corrupted System Files

            <br><br>

            In simple words, the Windows operating system was unable to function properly because of corrupted files, failed updates, driver conflicts, hardware issues, or operating system errors.
        </div>



        <b class="issue-section-title text-success fs-5">
            Step 1: What I Checked
        </b>

        <div class="ps-3 mt-3">

            • <b>Reviewed Previous L1 Troubleshooting</b>

            <span class="how-where d-block mt-1">
                First, I reviewed all troubleshooting steps already performed by L1 Support team to avoid repeating basic troubleshooting.

                <br><br>

            </span>

            </span>

            <span class="how-where d-block mt-1">

                <br><br>

            <span class="how-where d-block mt-1">

        </b>

        <div class="ps-3 mt-3">

            • <b>Ran System File Checker (SFC Scan)</b>

            <span class="how-where d-block mt-1">
                Opened Command Prompt as Administrator and executed:
                <br>
                <b>sfc /scannow</b>

                <br><br>

                This scanned and repaired corrupted Windows system files automatically.

                <br><br>

                <b>Easy Example:</b>
                SFC scan works like a repair mechanic that checks damaged Windows files and replaces them with healthy copies.
            </span>

            <br>

            • <b>Performed DISM Health Repair</b>

            <span class="how-where d-block mt-1">
                Opened Command Prompt as Administrator and executed:
                <br>
                <b>DISM /Online /Cleanup-Image /RestoreHealth</b>

                <br><br>

                This repaired damaged Windows image files and fixed operating system corruption issues.

            <br>

            • <b>Ran Windows Startup Repair</b>

            <span class="how-where d-block mt-1">

                <br>
                <b>Windows Recovery Environment (WinRE)</b>

                <br><br>

                Reinstalled faulty drivers when necessary.
            </span>

            <br>

            <span class="how-where d-block mt-1">
